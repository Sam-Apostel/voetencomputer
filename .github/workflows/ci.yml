name: CI

# Runs on a self-hosted runner on the maintainer's Mac (labels: self-hosted, macOS).
# This repository is public, and a self-hosted runner executes whatever a
# workflow run asks it to — including workflows edited inside a pull request.
# The repository therefore requires manual approval before any workflow run
# from an outside contributor (Settings → Actions → General → "Require approval
# for all external contributors"). Review pull requests that touch .github/
# before approving them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Release is what TestFlight ships; Debug includes the DEBUG-only code.
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A private DerivedData per job: sharing the default one with an open
      # Xcode session corrupts its build database.
      - name: Build
        run: |
          xcodebuild build \
            -project ScaleSync.xcodeproj \
            -scheme ScaleSync \
            -configuration "${{ matrix.configuration }}" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    name: TestFlight
    needs: build
    # Never on pull requests: this job holds the App Store Connect key.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.testflight)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check for App Store Connect key
        id: key
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::notice::TestFlight upload skipped: add the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 repository secrets to enable it."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - name: Install gems
        if: steps.key.outputs.present == 'true'
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4
      - name: Write App Store Connect key
        if: steps.key.outputs.present == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Upload to TestFlight
        if: steps.key.outputs.present == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: bundle exec fastlane beta
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
